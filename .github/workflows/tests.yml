name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install '.[pdf]' ruff==0.17.0
      - name: Lint and format
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Offline workflow
        run: citecalc demo --output runs/demo
      - name: Report links and interactions
        run: python scripts/check_report.py runs/demo/report/review.html
      - name: Package and privacy checks
        run: python scripts/check_package.py
      - name: Selected safeguard regressions
        run: python scripts/check_guards.py
