[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "citations-and-calculations"
version = "0.3.1"
description = "Clickable citations and reproducible calculations in Codex answers."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Alessandro Amaro"}]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf[crypto]>=5,<7"]

[project.scripts]
citecalc = "citations_calculations.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F841"]

[tool.setuptools.package-data]
citations_calculations = ["example_data/*"]
